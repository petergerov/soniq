# Builds soniq_<version>_amd64.deb (Vulkan ace-server + portable Node + web UI + systemd).
# On tag v*: uploads the .deb to the GitHub Release (creates the release if Mac has not yet).
name: Debian server

on:
  push:
    tags: ["v*"]
    branches: [main, develop]
    paths: ["linux/**", ".github/workflows/debian-server.yml", "scripts/common.sh", "backend/**", "frontend/**", "shared/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        id: v
        run: |
          echo "acestep=$(sed -n 's/^ACESTEP_REV="\(.*\)"/\1/p' scripts/common.sh)" >> "$GITHUB_OUTPUT"
          echo "node=$(sed -n 's/^NODE_VERSION="\(.*\)"/\1/p' scripts/common.sh)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)"; fi
          echo "app=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: engine/acestep.cpp
          key: acestep-deb-${{ steps.v.outputs.acestep }}-${{ hashFiles('linux/build-deb.sh') }}
      - uses: actions/cache@v4
        with:
          path: dist-linux/cache
          key: node-deb-${{ steps.v.outputs.node }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl ca-certificates xz-utils pkg-config \
            libvulkan-dev vulkan-tools glslang-tools spirv-tools spirv-headers \
            patchelf fakeroot dpkg-dev
          # glslc: prefer the package when present (Ubuntu 24.04+); SDK step supplies it otherwise
          sudo apt-get install -y --no-install-recommends glslc || true

      # glslc/shaderc from the LunarG SDK — apt's glslc is often too old or incomplete for ggml-vulkan
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Build .deb
        env:
          VERSION: ${{ steps.v.outputs.app }}
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
        run: |
          chmod +x linux/build-deb.sh
          # SDK action exports VULKAN_SDK; ensure glslc from the SDK is first on PATH
          if [ -n "${VULKAN_SDK:-}" ]; then
            export PATH="$VULKAN_SDK/bin:$PATH"
            export CMAKE_PREFIX_PATH="${VULKAN_SDK}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
          fi
          command -v glslc
          glslc --version || true
          linux/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: soniq-${{ steps.v.outputs.app }}-amd64
          path: dist-linux/soniq_${{ steps.v.outputs.app }}_amd64.deb
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEB="dist-linux/soniq_${{ steps.v.outputs.app }}_amd64.deb"
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" \
              --title "SONIQ ${{ steps.v.outputs.app }}" --generate-notes
          fi
