# Builds soniq_<version>_{amd64,arm64}.deb (Vulkan ace-server + portable Node + web UI + systemd).
# On tag v*: uploads both .deb files to the GitHub Release (creates the release if Mac has not yet).
name: Debian server

on:
  push:
    tags: ["v*"]
    branches: [main, develop]
    paths: ["linux/**", ".github/workflows/debian-server.yml", "scripts/common.sh", "backend/**", "frontend/**", "shared/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        id: v
        run: |
          echo "acestep=$(sed -n 's/^ACESTEP_REV="\(.*\)"/\1/p' scripts/common.sh)" >> "$GITHUB_OUTPUT"
          echo "node=$(sed -n 's/^NODE_VERSION="\(.*\)"/\1/p' scripts/common.sh)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)"; fi
          echo "app=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: engine/acestep.cpp
          key: acestep-deb-${{ matrix.deb_arch }}-${{ steps.v.outputs.acestep }}-${{ hashFiles('linux/build-deb.sh') }}
      - uses: actions/cache@v4
        with:
          path: dist-linux/cache
          key: node-deb-${{ matrix.deb_arch }}-${{ steps.v.outputs.node }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl ca-certificates xz-utils pkg-config \
            libvulkan-dev vulkan-tools glslang-tools spirv-tools spirv-headers \
            patchelf fakeroot dpkg-dev
          sudo apt-get install -y --no-install-recommends glslc || true

      # LunarG SDK (glslc/shaderc). On arm64 the action may skip; apt glslc is the fallback.
      - name: Install Vulkan SDK
        continue-on-error: true
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Build .deb
        env:
          VERSION: ${{ steps.v.outputs.app }}
        run: |
          chmod +x linux/build-deb.sh
          if [ -n "${VULKAN_SDK:-}" ]; then
            export PATH="$VULKAN_SDK/bin:$PATH"
            export CMAKE_PREFIX_PATH="${VULKAN_SDK}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
          fi
          command -v glslc
          glslc --version || true
          uname -m
          linux/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: soniq-${{ steps.v.outputs.app }}-${{ matrix.deb_arch }}
          path: dist-linux/soniq_${{ steps.v.outputs.app }}_${{ matrix.deb_arch }}.deb
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEB="dist-linux/soniq_${{ steps.v.outputs.app }}_${{ matrix.deb_arch }}.deb"
          TAG="$GITHUB_REF_NAME"
          # Retry create/upload: Mac or the other arch job may create the release in parallel
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$DEB" --clobber && exit 0
            elif gh release create "$TAG" "$DEB" \
              --title "SONIQ ${{ steps.v.outputs.app }}" --generate-notes; then
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "Could not publish $DEB to release $TAG"
          exit 1
