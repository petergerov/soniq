# Baut SONIQ.app und SONIQ.dmg (macos/build-app.sh), signiert und notarisiert sie, wenn die Secrets dafür
# hinterlegt sind, und hängt die DMG bei einem Versions-Tag (v1.2.3) an ein GitHub-Release.
# Welche Secrets und woher die Werte kommen: macos/README.md. Ohne Secrets wird ad hoc signiert.
name: Mac app

on:
  push:
    tags: ["v*"]
    branches: [main, develop]
    paths: ["macos/**", ".github/workflows/mac-app.yml", "scripts/common.sh"]
  workflow_dispatch:
    inputs:
      skip_notary:
        description: "Only sign, don't notarize (faster test build)"
        type: boolean
        default: false

permissions:
  contents: write   # Release anlegen

jobs:
  build:
    runs-on: macos-15   # Apple Silicon
    timeout-minutes: 90
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      # Notarisieren mit API-Schlüssel (bevorzugt) oder Apple-ID; beim manuellen Start abschaltbar
      HAS_NOTARY: ${{ (secrets.APPLE_API_KEY_BASE64 != '' || secrets.APPLE_ID != '') && !inputs.skip_notary }}
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        id: v
        run: |
          echo "acestep=$(sed -n 's/^ACESTEP_REV="\(.*\)"/\1/p' scripts/common.sh)" >> "$GITHUB_OUTPUT"
          echo "demucs=$(sed -n 's/^DEMUCS_REV="\(.*\)"/\1/p' scripts/common.sh)" >> "$GITHUB_OUTPUT"
          echo "node=$(sed -n 's/^NODE_VERSION="\(.*\)"/\1/p' scripts/common.sh)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)"; fi
          echo "app=$v" >> "$GITHUB_OUTPUT"

      # Der Modellserver braucht beim ersten Mal einige Minuten; danach kommt er aus dem Cache
      - uses: actions/cache@v4
        with:
          path: engine/acestep.cpp
          key: acestep-${{ steps.v.outputs.acestep }}-${{ hashFiles('macos/build-app.sh') }}
      - uses: actions/cache@v4
        with:
          path: engine/demucs.cpp
          key: demucs-${{ steps.v.outputs.demucs }}-${{ hashFiles('macos/build-app.sh', 'scripts/common.sh') }}
      - uses: actions/cache@v4
        with:
          path: dist-mac/cache
          key: node-${{ steps.v.outputs.node }}

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/soniq-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046  # bestehende Schlüsselbunde als einzelne Argumente behalten
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "==> Signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then echo "No 'Developer ID Application' identity in MACOS_CERTIFICATE."; exit 1; fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build SONIQ.app and SONIQ.dmg
        env:
          VERSION: ${{ steps.v.outputs.app }}
        run: macos/build-app.sh --dmg

      - name: Notarize
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: macos/notarize.sh dist-mac/SONIQ.dmg

      - name: Name the DMG
        run: mv dist-mac/SONIQ.dmg "dist-mac/SONIQ-${{ steps.v.outputs.app }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: SONIQ-${{ steps.v.outputs.app }}
          path: dist-mac/SONIQ-${{ steps.v.outputs.app }}.dmg
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="dist-mac/SONIQ-${{ steps.v.outputs.app }}.dmg"
          TAG="$GITHUB_REF_NAME"
          NOTE=""
          if [ "$HAS_CERT" != 'true' ] || [ "$HAS_NOTARY" != 'true' ]; then
            NOTE="Not notarized: on first start, open it via System Settings › Privacy & Security › Open Anyway."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
            [ -n "$NOTE" ] && gh release edit "$TAG" --notes "$NOTE" || true
          else
            gh release create "$TAG" "$DMG" \
              --title "SONIQ ${{ steps.v.outputs.app }}" --generate-notes --notes "$NOTE"
          fi

      - name: Remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true
